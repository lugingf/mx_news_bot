name: deploy-blue-green

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m ./...

      - name: Unit tests
        run: go test ./... --skip=Integration

      - name: Start Postgres
        run: |
          docker run -d --name mx-preflight-db \
            -e POSTGRES_DB=mx -e POSTGRES_USER=mx -e POSTGRES_PASSWORD=mxpassword \
            -p 6444:5432 postgres:17-alpine
          for _ in $(seq 1 30); do
            if docker exec mx-preflight-db pg_isready -U mx >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "postgres did not become ready" >&2
          exit 1

      # Applying the migrations here is also what proves they land cleanly on an empty database
      # before the deploy runs them against the real one.
      - name: Apply migrations
        run: |
          cat > /tmp/preflight-config.json <<'JSON'
          {"database":{"conn":"host=localhost port=6444 user=mx dbname=mx password=mxpassword sslmode=disable"}}
          JSON
          go run ./cmd/mx -config /tmp/preflight-config.json -migrate-up -migrations infra/migrations

      # These are the tests that catch SQL which does not match the schema; without a database
      # they skip, and the whole storage layer goes unchecked.
      - name: Integration tests
        env:
          MX_TEST_DSN: host=localhost port=6444 user=mx dbname=mx password=mxpassword sslmode=disable
        run: go test ./... -run Integration -count=1

      - name: Stop Postgres
        if: always()
        run: docker rm -f mx-preflight-db || true

      - name: Build binary
        run: go build -o mx_news_bot ./cmd/mx

  build-and-push-image:
    if: github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TAG="${{ inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "image=ghcr.io/${OWNER}/mx-news-bot:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
      AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
      AWS_SSH_PORT: ${{ secrets.AWS_SSH_PORT }}
      DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      APP_NAME: ${{ vars.APP_NAME || 'mx_news_bot' }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/mx_news_bot' }}
      PUBLIC_PORT: ${{ vars.PUBLIC_PORT || '8585' }}
      PUBLIC_BIND_ADDR: ${{ vars.PUBLIC_BIND_ADDR || '127.0.0.1' }}
      NETWORK: ${{ vars.DEPLOY_NETWORK || 'mx_news_bot_net' }}
      # lap_vision's network, joined as a second one so the bot can reach its API.
      BACKEND_NETWORK: ${{ vars.BACKEND_NETWORK || 'lapvision_net' }}
      WEBHOOK_PATH: ${{ vars.WEBHOOK_PATH }}
      METRICS_PATH: ${{ vars.METRICS_PATH || '/metrics-mx' }}
      ENABLE_HOST_GATEWAY: ${{ vars.ENABLE_HOST_GATEWAY || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

      - name: Validate deploy settings
        run: |
          : "${AWS_SSH_HOST:?AWS_SSH_HOST secret is required}"
          : "${AWS_SSH_USER:?AWS_SSH_USER secret is required}"
          : "${DEPLOY_CONFIG_JSON:?DEPLOY_CONFIG_JSON secret is required}"
          : "${WEBHOOK_PATH:?WEBHOOK_PATH variable is required}"

      - name: Add remote host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          PORT="${AWS_SSH_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${AWS_SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deploy script
        run: |
          PORT="${AWS_SSH_PORT:-22}"
          REMOTE_DIR="${APP_DIR:-/opt/mx_news_bot}"
          ssh -p "${PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" "mkdir -p '${REMOTE_DIR}'"
          scp -P "${PORT}" ./deploy/blue-green-deploy.sh "${AWS_SSH_USER}@${AWS_SSH_HOST}:${REMOTE_DIR}/blue-green-deploy.sh"

      - name: Upload runtime config
        run: |
          PORT="${AWS_SSH_PORT:-22}"
          REMOTE_DIR="${APP_DIR:-/opt/mx_news_bot}"
          TMP_CONFIG="$(mktemp)"
          printf '%s' "${DEPLOY_CONFIG_JSON}" > "${TMP_CONFIG}"
          scp -P "${PORT}" "${TMP_CONFIG}" "${AWS_SSH_USER}@${AWS_SSH_HOST}:${REMOTE_DIR}/config.json"
          ssh -p "${PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" "chmod 644 '${REMOTE_DIR}/config.json'"
          rm -f "${TMP_CONFIG}"

      - name: Blue-green deploy
        run: |
          PORT="${AWS_SSH_PORT:-22}"
          REMOTE_DIR="${APP_DIR:-/opt/mx_news_bot}"
          IMAGE="${{ needs.build-and-push-image.outputs.image }}"
          GHCR_USER="${GHCR_USERNAME:-${GITHUB_ACTOR}}"
          ssh -p "${PORT}" "${AWS_SSH_USER}@${AWS_SSH_HOST}" "chmod +x '${REMOTE_DIR}/blue-green-deploy.sh' && APP_NAME='${APP_NAME}' APP_DIR='${REMOTE_DIR}' PUBLIC_PORT='${PUBLIC_PORT}' PUBLIC_BIND_ADDR='${PUBLIC_BIND_ADDR}' NETWORK='${NETWORK}' BACKEND_NETWORK='${BACKEND_NETWORK}' WEBHOOK_PATH='${WEBHOOK_PATH}' METRICS_PATH='${METRICS_PATH}' ENABLE_HOST_GATEWAY='${ENABLE_HOST_GATEWAY}' IMAGE='${IMAGE}' GHCR_USERNAME='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' '${REMOTE_DIR}/blue-green-deploy.sh'"
